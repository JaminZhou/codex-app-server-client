name: npm release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact non-preview version in package.json (preparation only)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-release-candidate
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'JaminZhou/codex-app-server-client' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Require current main CI and exact version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/trusted-release.mjs gate
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import assert from "node:assert/strict"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); assert.equal(pkg.version, process.env.RELEASE_VERSION);'
          node scripts/trusted-release.mjs before
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm compatibility:smoke
      - run: pnpm protocol:latest-check
      - name: Prepare and verify one immutable candidate
        run: pnpm release:pack
      - name: Recheck main and display approval identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/trusted-release.mjs gate
          node --input-type=module -e 'import { readFileSync, appendFileSync } from "node:fs"; const e = JSON.parse(readFileSync("artifacts/release-evidence.json", "utf8")); appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Candidate only — not published\n\n```json\n" + JSON.stringify({version:e.version, sourceCommit:e.sourceCommit, integrity:e.integrity, candidateRunId:process.env.GITHUB_RUN_ID, intendedTag:e.intendedTag}, null, 2) + "\n```\n\nApprove this exact identity before manually running npm publish. Preparation never grants publication approval.\n");'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-candidate-${{ inputs.version }}
          path: |
            artifacts/jaminzhou-codex-app-server-client-${{ inputs.version }}.tgz
            artifacts/release-evidence.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14
