name: npm publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved exact non-preview version (publishes to latest)
        required: true
        type: string
      source_sha:
        description: Approved full source SHA (must still be current main)
        required: true
        type: string
      candidate_run_id:
        description: Successful npm release candidate run ID
        required: true
        type: string
      integrity:
        description: Approved complete sha512- integrity from that candidate
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Serialize all versions; do not cancel an in-flight registry write.
concurrency:
  group: npm-publication
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_SHA: ${{ inputs.source_sha }}
  RELEASE_INTEGRITY: ${{ inputs.integrity }}
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}

jobs:
  verify:
    if: github.repository == 'JaminZhou/codex-app-server-client' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.select.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - id: select
        name: Check current CI and trusted candidate run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/trusted-release.mjs select
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
          merge-multiple: true
          digest-mismatch: error
      - id: artifact
        run: node scripts/trusted-release.mjs artifact
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test approved bytes without publishing credentials
        env:
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          node scripts/package-smoke.mjs "$TARBALL"
          node scripts/package-smoke.mjs "$TARBALL" --pnpm

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm must bind this environment AND this exact workflow. Protect the environment to main.
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Pin the OIDC-capable npm CLI (no project install)
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@11.6.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
          merge-multiple: true
          digest-mismatch: error
      - id: artifact
        name: Recheck bytes and source immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/trusted-release.mjs gate
          node scripts/trusted-release.mjs artifact
          node scripts/trusted-release.mjs before
      - id: publish
        name: Publish only the approved archive using OIDC
        env:
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: npm publish "$TARBALL" --tag latest --access public --registry=https://registry.npmjs.org/ --ignore-scripts
      # Diagnose even an uncertain publish response. Never automatically retry a registry write.
      - name: Read registry tags and compare downloaded bytes
        if: ${{ !cancelled() && steps.publish.outcome != 'skipped' }}
        run: node scripts/trusted-release.mjs after
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.publish.outcome != 'skipped' }}
        with:
          name: npm-publication-registry-${{ inputs.version }}
          path: |
            artifacts/registry-before.json
            artifacts/publication.json
          if-no-files-found: error
          retention-days: 90

  registry-consumers:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify fresh exact-version registry consumers (no OIDC permission)
        run: |
          node scripts/package-smoke.mjs --registry "$RELEASE_VERSION" "$RELEASE_INTEGRITY"
          node scripts/package-smoke.mjs --registry "$RELEASE_VERSION" "$RELEASE_INTEGRITY" --pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-publication-registry-${{ inputs.version }}
          path: publication
          digest-mismatch: error
      - name: Complete publication receipt
        run: |
          node --input-type=module -e 'import { readFileSync, writeFileSync, appendFileSync } from "node:fs"; const path = "publication/publication.json"; const e = JSON.parse(readFileSync(path, "utf8")); e.consumerVerified = true; e.consumers = ["npm", "pnpm@11.7.0"]; e.consumerVerifiedAt = new Date().toISOString(); writeFileSync(path, JSON.stringify(e, null, 2) + "\n"); appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Published and registry consumers verified\n\n```json\n" + JSON.stringify(e, null, 2) + "\n```\n");'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-publication-complete-${{ inputs.version }}
          path: publication/publication.json
          if-no-files-found: error
          retention-days: 90
